name: Release

# Dispara ao dar push numa tag vX.Y.Z. Builda, assina (Developer ID),
# notariza, monta o .dmg, gera BUILD PROVENANCE (SLSA) e publica a Release.
# Qualquer um pode verificar depois:
#   gh attestation verify Harbofly.dmg --repo carloshpdoc/Harbofly
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # criar a Release
  id-token: write      # OIDC pra atestação
  attestations: write  # gravar a build provenance

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historico completo -> build number = nº de commits

      - name: Instalar create-dmg
        run: brew install create-dmg

      - name: Importar certificado Developer ID
        env:
          CERT_B64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KC_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" build.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Preparar chave ASC (.p8)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/asc.p8"

      - name: Build + assinar + notarizar + .dmg
        env:
          SIGN_ID: ${{ secrets.SIGN_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SU_PUBLIC_ED_KEY: ${{ secrets.SU_PUBLIC_ED_KEY }}   # habilita o Sparkle no app
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          ./make-dmg.sh

      - name: Build provenance (SLSA) do .dmg
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: Harbofly.dmg

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotente: cria a release ou, se já existir (re-run), substitui o asset.
          gh release create "${{ github.ref_name }}" Harbofly.dmg \
            --title "${{ github.ref_name }}" \
            --generate-notes \
          || gh release upload "${{ github.ref_name }}" Harbofly.dmg --clobber

      # Assina o DMG com a chave EdDSA e (re)gera o appcast.xml, apontando o
      # enclosure pro asset da Release recém-criada. Commita de volta na main —
      # é esse arquivo que o SUFeedURL do app lê.
      - name: Gerar appcast do Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          SPARKLE_VER=2.9.4
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VER}/Sparkle-${SPARKLE_VER}.tar.xz" -o sparkle.tar.xz
          mkdir -p sparkle-tools && tar xJf sparkle.tar.xz -C sparkle-tools
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_ed_priv"
          mkdir -p dist && cp Harbofly.dmg dist/
          ./sparkle-tools/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle_ed_priv" \
            --download-url-prefix "https://github.com/carloshpdoc/Harbofly/releases/download/${TAG}/" \
            dist/
          rm -f "$RUNNER_TEMP/sparkle_ed_priv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # O checkout está no commit da TAG (destacado); commita no topo atual da main
          # pra não sobrescrever commits mais novos e ser seguro em re-run.
          git fetch origin main
          git checkout -B main origin/main
          cp dist/appcast.xml appcast.xml
          git add appcast.xml
          if git commit -m "appcast: ${TAG}"; then git push origin main; else echo "appcast sem mudança"; fi

      - name: Bump automático do cask no tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"                                   # v1.1.0 -> 1.1.0
          SHA="$(shasum -a 256 Harbofly.dmg | cut -d' ' -f1)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/carloshpdoc/homebrew-tap.git" tap
          cd tap
          # runner é macOS -> sed BSD (-i '')
          sed -i '' -E "s/^  version \"[^\"]+\"/  version \"${VER}\"/" Casks/harbofly.rb
          sed -i '' -E "s/^  sha256 \"[0-9a-f]{64}\"/  sha256 \"${SHA}\"/" Casks/harbofly.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git commit -am "cask: harbofly ${VER}"; then git push; else echo "cask já em ${VER}"; fi
